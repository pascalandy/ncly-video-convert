["video-convert.summary"]
description = "Help summary for the single video conversion command."
other = "Convert one video to a sibling .converted.mp4 with HandBrakeCLI"

["video-convert.file"]
description = "Help for the required local input video."
other = "Video to read without changing it"

["video-convert.force"]
description = "Help for explicit consent to replace the existing converted output."
other = "Replace the existing output only after a successful conversion"

["video-convert.timeout"]
description = "Help for the total HandBrake execution limit."
other = "Stop HandBrake after this duration"

["video-convert.no_file"]
description = "Usage error when the input is not a readable regular file. {{.File}} names the input."
other = "{{.File}} is not a readable regular input file."

["video-convert.input_hint"]
description = "Recovery hint for invalid input."
other = "Pass the path of one readable video to ncly video convert."

["video-convert.bad_timeout"]
description = "Usage error for a nonpositive or malformed timeout."
other = "The timeout must be a positive duration."

["video-convert.timeout_hint"]
description = "Recovery hint for an invalid timeout."
other = "Use --timeout 2h or another positive duration."

["video-convert.unsafe_output"]
description = "Usage error for an output that is a link, special file, directory, or the input itself. {{.Output}} names it."
other = "{{.Output}} is not a safe, separate output file."

["video-convert.output_hint"]
description = "Recovery hint for an unsafe or inaccessible output location."
other = "Choose an input folder that you can read and write, with a separate .converted.mp4 destination."

["video-convert.exists"]
description = "Confirmation error when an output already exists. {{.Output}} names it."
other = "{{.Output}} already exists."

["video-convert.force_hint"]
description = "Recovery hint explaining explicit overwrite consent."
other = "Review the output, then add --force to replace it after conversion succeeds."

["video-convert.io_error"]
description = "Runtime failure for staging, publication, verification, or cleanup. {{.Detail}} holds the operating system error."
other = "The converted output could not be prepared or published: {{.Detail}}"

["video-convert.no_output"]
description = "Runtime failure when HandBrake exits zero without a nonempty regular output."
other = "HandBrake did not produce a nonempty regular output file."

["video-convert.retry_hint"]
description = "Recovery hint after a failed conversion."
other = "Check the input video and the output folder's free space and permissions, then run a dry run before trying again."

["video-convert.result"]
description = "Human success text. {{.Output}} is the verified output path and {{.Size}} its formatted size."
other = "Created {{.Output}} ({{.Size}})."

["video-convert.plan"]
description = "Human dry-run text. {{.File}} and {{.Output}} are the planned paths, {{.Preset}} the fixed preset."
other = "Would convert {{.File}} to {{.Output}} with {{.Preset}}. Video decoding remains unchecked."
