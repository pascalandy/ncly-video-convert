# English catalog of the video-convert extension. Each entry needs a description
# of where the text appears, for the translator. A text between {{ and }} is
# a field that the handler fills.

["video-convert.inspect.summary"]
description = "Help page: summary of `ncly video convert`, which gives the size and the line count of a file."
other = "Give the size and the line count of a file"

["video-convert.inspect.file"]
description = "Help page: the file argument of `ncly video convert`."
other = "File to inspect"

["video-convert.inspect.timeout"]
description = "Help page: the --timeout flag of `ncly video convert`, which bounds the run of its worker."
other = "Stop the inspection after this duration"

["video-convert.inspect.no_file"]
description = "Message of USAGE_INVALID when the file of `ncly video convert` is missing or is no regular file. {{.File}} is the path that the caller gave."
other = "{{.File}} is no file that video convert can inspect."

["video-convert.inspect.bad_timeout"]
description = "Message of USAGE_INVALID when the --timeout of `ncly video convert` is no positive duration. {{.Timeout}} is the value that the caller gave, and --timeout stays as is."
other = "--timeout {{.Timeout}} is no duration, such as 30s or 5m."

["video-convert.inspect.result"]
description = "Text of `ncly video convert`: the line count and the size of the file. {{.File}} is the path that the caller gave, {{.Count}} the line count, and {{.Size}} the size with its unit, such as 12 B."
one = "{{.File}}: {{.Count}} line, {{.Size}}"
other = "{{.File}}: {{.Count}} lines, {{.Size}}"
