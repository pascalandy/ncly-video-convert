format_version = 1
contract_version = 1
domain = "video"
name = "convert"

[[commands]]
path = "video convert"
summary = "video-convert.inspect.summary"
examples = ["ncly video convert notes.md", "ncly video convert notes.md --json"]
effects = {}
requires = { bins = ["python3"] }

[[commands.args]]
name = "file"
summary = "video-convert.inspect.file"
required = true

[[commands.flags]]
name = "timeout"
value = "duration"
default = "30s"
summary = "video-convert.inspect.timeout"

[commands.result.schema]
type = "object"
required = ["size_bytes", "lines"]
properties = { size_bytes = { type = "integer", minimum = 0 }, lines = { type = "integer", minimum = 0 } }

[programs.python3]
version = "3.9"
install = { brew = ["brew", "install", "python"], pacman = ["sudo", "pacman", "-S", "python"], apt = ["sudo", "apt", "install", "python3"], dnf = ["sudo", "dnf", "install", "python3"] }
