format_version = 1
contract_version = 1
domain = "video"
name = "convert"

[[commands]]
path = "video convert"
summary = "video-convert.summary"
examples = ["ncly video convert clip.mov --dry-run", "ncly video convert clip.mov", "ncly video convert clip.mov --force --json"]
effects = { user_writes = true }
modes = { dry_run = true }
requires = { bins = ["HandBrakeCLI"] }

[[commands.args]]
name = "file"
summary = "video-convert.file"
required = true

[[commands.flags]]
name = "force"
shorthand = "f"
summary = "video-convert.force"

[[commands.flags]]
name = "timeout"
value = "duration"
default = "2h"
summary = "video-convert.timeout"

[commands.result.schema]
type = "object"
required = ["input", "output", "size_bytes"]
properties = { input = { type = "string" }, output = { type = "string" }, size_bytes = { type = "integer", minimum = 1 } }

[commands.result.dry_run_schema]
type = "object"
required = ["dry_run", "input", "output", "preset", "overwrite", "pending_checks"]
properties = { dry_run = { const = true }, input = { type = "string" }, output = { type = "string" }, preset = { type = "string" }, overwrite = { type = "boolean" }, pending_checks = { type = "array", items = { type = "string" } } }

[[errors]]
code = "VIDEO_CONVERT_UNREADABLE"
exit = 2

[programs.HandBrakeCLI]
install = { brew = ["brew", "install", "handbrake"], pacman = ["sudo", "pacman", "-S", "handbrake-cli"], apt = ["sudo", "apt", "install", "handbrake-cli"], dnf = ["sudo", "dnf", "install", "HandBrake-cli"] }
