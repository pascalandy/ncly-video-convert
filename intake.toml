[[facts]]
kind = "sourced"
statement = "The command converts one readable regular local file to a nonempty MP4 beside it, using Fast 1080p30; H.264 is the default and H.265 uses Main 10."
source = "spec.md"
revision = "708ad0a"
read = "ncly video convert, success criteria and encoder selection"

[[facts]]
kind = "sourced"
statement = "The input is read only. The sole user write is the converted MP4. No network service, key, paid request, reusable run record, or interactive question is needed."
source = "spec.md and convert.go"
revision = "708ad0a"
read = "Effects; convert, job.encode, transcode, normalizeAudio, and publish"

[[facts]]
kind = "sourced"
statement = "Preparation resolves paths, checks access and destination safety, scans one title, selects a host encoder, and probes ffmpeg when audio normalization is needed. A dry run performs that preparation without staging or publishing."
source = "convert.go"
revision = "708ad0a"
read = "convert, job.prepare, scan, checkDestination, and physical"

[[facts]]
kind = "sourced"
statement = "HandBrakeCLI writes its JSON title set and encode progress to stdout; scan-only mode prints the title set and exits, and an absent title sets HB_ERROR_WRONG_INPUT."
source = "https://github.com/HandBrake/HandBrake/blob/1.11.2/test/test.c"
revision = "1.11.2"
read = "main, PrintTitleSetInfo, show_progress_json, and HandleEvents HB_STATE_SCANDONE"

[[facts]]
kind = "sourced"
statement = "HandBrake CLI options depend on host hardware. The adapter reads --help for VideoToolbox and Quick Sync availability and falls back once to the codec's CPU encoder after a GPU encode failure."
source = "https://handbrake.fr/docs/en/latest/cli/command-line-reference.html and convert.go"
revision = "documentation read 2026-11-03; adapter 708ad0a"
read = "Command line reference introduction; chooseEncoder, the codecs table, and transcode"

[[facts]]
kind = "sourced"
statement = "loudnorm accepts measured loudness, range, threshold and true peak for its linear second pass, and emits JSON statistics; dynamic processing can require 192 kHz, so the adapter explicitly writes 48 kHz AAC."
source = "https://github.com/FFmpeg/FFmpeg/blob/n9.0.2/libavfilter/af_loudnorm.c and convert.go"
revision = "FFmpeg n9.0.2; adapter 708ad0a"
read = "loudnorm_options, config_input, uninit; measured and normalizeAudio"

[[facts]]
kind = "sourced"
statement = "The two-hour default timeout covers scan, encode and normalization together. The SDK stops children on timeout, SIGINT and SIGTERM. Staging is removed on ordinary returns. SIGKILL, power loss and filesystem refusal can prevent cleanup. A HandBrake that ignores the whole 15-second stop budget can also prevent cleanup because ncly then stops the extension."
source = "spec.md and convert.go"
revision = "708ad0a"
read = "execution paragraph and Limits; convert, job.encode, and its deferred cleanup"

[[facts]]
kind = "sourced"
statement = "Preparation rejects invalid paths, codecs and deadlines; missing tools return PREREQ_MISSING. HandBrake scan exit 2 and a still-image title return VIDEO_CONVERT_UNREADABLE; other worker failures are RUNTIME. Repeating after an output exists requires --force."
source = "spec.md and convert.go"
revision = "708ad0a"
read = "Failures; convert, scan, transcode, and checkDestination"

[[facts]]
kind = "sourced"
statement = "A private staging directory is beside the destination. A complete staged file is published with a hard link in create mode and an atomic replacing rename in force mode; neither operation writes through an output link."
source = "convert.go"
revision = "708ad0a"
read = "job.encode, publish, and checkDestination"

[[facts]]
kind = "sourced"
statement = "Orientation, dimensions, frame rate, sample aspect ratio, colour and HDR declarations affect display. The preset bounds dimensions and frame rate; real acceptance checks orientation and duration, and H.265 keeps ten-bit HDR."
source = "spec.md, qa.md, and acceptance.sh"
revision = "708ad0a"
read = "encoder paragraph; Result, Fidelity and Known limits; probe, ssim, decoded, heard and hevc-output checks"

[[facts]]
kind = "unknown"
